<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    const socket = new WebSocket('ws://localhost:8888');
    // 连接打开
    socket.onopen = (e) => {
      console.log(e)
      socket.send('[client] to [server] hello server')
    }

    socket.onmessage = (e) => {
      console.log(e.data)
    }

  </script>
</body>

</html>
